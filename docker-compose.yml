services:
    db:
        platform: linux/amd64
        build: 
            context: ./src/db
        environment: 
            POSTGRES_DB: "${POSTGRES_DB}"
            POSTGRES_USER: "${POSTGRES_USER}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
            GEOCODER_STATES: "${GEOCODER_STATES}"
            GEOCODER_YEAR: "${GEOCODER_YEAR}"
            BYPASS_SSL: "${BYPASS_SSL}"
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 30
        networks:
            default:
                aliases:
                    - db
    api:
        build:
            context: ./src/server
        environment: 
            POSTGRES_DB: "${POSTGRES_DB}"
            POSTGRES_USER: "${POSTGRES_USER}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        ports:
            - "5000:5000"
        depends_on:
            db:
                condition: service_healthy
        networks:
            default:
                aliases:
                    - api

    files:
        ports:
            - "7000:80"
        build:
            context: ./src/files

    app:
        platform: linux/amd64
        build:
            context: ./src/app
            args:
              BYPASS_SSL: "${BYPASS_SSL}"
        working_dir: /home/rstudio/workspace/
        environment:
            PASSWORD: "${RSTUDIO_PASSWORD}"
            DISABLE_AUTH: "${DISABLE_AUTHENTICATION}"
        ports:
            - "8787:8787"
            - "8000:3838"
        depends_on:
            - api
        networks:
            default:
                aliases:
                    - app

networks:
    default:
        driver: bridge
